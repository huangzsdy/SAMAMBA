# Warmup + OneCycleLR 实验配置
# 主要改进:
# 1. 添加学习率 warmup
# 2. 使用 OneCycleLR 调度策略 (比 CosineAnnealing 更激进)

exp:
  name: SAMamba_WarmupOneCycle
  save_exp: True
  bs: 1
  total_epochs: 400
  log_interval: 1
  save_interval: 150
  test_interval: 1
  device: 1

model:
  net:
    type: SAMamba

  optim:
    type: AdamW
    # 使用稍高的初始学习率，OneCycleLR 会自动找到最优值
    init_lr: !!float 1e-3
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]
  loss:
    loss_1:
      type: SoftIoULoss
      weight: 1
    loss_2:
      type: WeightedDiceLoss
      weight: 1
    loss_3:
      type: FocalLoss
      weight: 1
  lr:
    # Warmup 配置
    warmup_iter: 1000  # 前 1000 次迭代用于 warmup
    # OneCycleLR 配置
    scheduler:
      type: OneCycleLR
      step_interval: iter  # 每个 iteration 更新
      max_lr: !!float 1e-3  # 最大学习率
      pct_start: 0.3  # 30% 的时间用于 warmup 阶段
      anneal_strategy: cos  # 余弦退火
      div_factor: 25.0  # initial_lr = max_lr / div_factor
      final_div_factor: 1000.0  # min_lr = initial_lr / final_div_factor

dataset:
  name:
  train:
    type: Dataset_aug_bac
    # data_root: c:/Users/ThinkPad/my_own_files/for_min/my_own_files/study/ai/dataset/NUDT-SIRST/trainval
    data_root: /mnt/c/users/ThinkPad/my_own_files/for_min/my_own_files/study/ai/dataset/NUDT-SIRST/trainval

    img_sz: 1024

  test:
    type: Dataset_test
    # data_root: c:/Users/ThinkPad/my_own_files/for_min/my_own_files/study/ai/dataset/NUDT-SIRST/test
    data_root: /mnt/c/users/ThinkPad/my_own_files/for_min/my_own_files/study/ai/dataset/NUDT-SIRST/test

    img_sz: 1024

