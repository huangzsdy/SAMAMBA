exp:
  name: SAMamba
  save_exp: True
  bs: 2
  total_epochs: 120
  log_interval: 1
  save_interval: 60
  test_interval: 1
  device: 0
  nw: 4                    # 数据加载线程数，加速数据读取

  # 加速训练配置 (最快稳定模式: AMP + 梯度累积)
  use_amp: True
  accum_steps: 4
  use_compile: False         # 关闭，兼容 AMP + 梯度累积
  pin_memory: True           # 锁页内存，加速CPU-GPU传输
  prefetch_factor: 4         # 数据预取数量
  channels_last: True        # channels_last 内存格式，提速约10-20%
model:
  net:
    type: SAMamba

  optim:
    type: AdamW
#    init_lr: !!float 1e-3
    init_lr: !!float 5e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]
  loss:
    loss_1:
      type: SoftIoULoss
      weight: 1
    loss_2:
      type: WeightedDiceLoss
      weight: 1
    loss_3:
      type: FocalLoss
      weight: 1
#   resume_train: ~
  lr:
    warmup_iter: -1 # warmup to init_lr
    # type: CosineAnnealingLR /
    scheduler:
#      type: ~
      type: CosineAnnealingLR
      step_interval: iter  # iter or epoch (every iter or every epoch to update once)
      eta_min: !!float 1e-5

dataset:
  name:
  train:
    type: Dataset_aug_bac
    data_root: /mnt/c/users/ThinkPad/my_own_files/for_min/my_own_files/study/ai/dataset/NUDT-SIRST/trainval
    img_sz: 1024

  test:
    type: Dataset_test
    data_root:  /mnt/c/users/ThinkPad/my_own_files/for_min/my_own_files/study/ai/dataset/NUDT-SIRST/test
    img_sz: 1024

resume:
  net_path: 
  state_path: