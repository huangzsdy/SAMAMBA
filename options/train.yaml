exp:
  name: SAMamba
  save_exp: True
  bs: 4                    # 增大 batch size
  total_epochs: 120
  log_interval: 10          # 减少日志频率
  save_interval: 1
  test_interval: 1
  device: 0                 # 单卡用整数，多卡用 launch 方式启动
  nw: 8                    # 数据加载线程数

  # 加速训练配置
  use_amp: True
  accum_steps: 1           # batch够大，关闭梯度累积
  use_compile: False
  pin_memory: True
  prefetch_factor: 2        # 减少预取
  channels_last: True
model:
  net:
    type: SAMamba

  optim:
    type: AdamW
#    init_lr: !!float 1e-3
    init_lr: !!float 5e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]
  loss:
    loss_1:
      type: SoftIoULoss
      weight: 1
    loss_2:
      type: WeightedDiceLoss
      weight: 1
    loss_3:
      type: FocalLoss
      weight: 1
#   resume_train: ~
  lr:
    warmup_iter: -1 # warmup to init_lr
    # type: CosineAnnealingLR /
    scheduler:
#      type: ~
      type: CosineAnnealingLR
      step_interval: iter  # iter or epoch (every iter or every epoch to update once)
      eta_min: !!float 1e-5

dataset:
  name:
  train:
    type: Dataset_aug_bac
    data_root: /mnt/c/users/ThinkPad/my_own_files/for_min/my_own_files/study/ai/dataset/NUDT-SIRST/trainval
    img_sz: 512
    bd_loss: False

  test:
    type: Dataset_test
    data_root:  /mnt/c/users/ThinkPad/my_own_files/for_min/my_own_files/study/ai/dataset/NUDT-SIRST/test
    img_sz: 512

resume:
  net_path:
  state_path: