# 边界损失 (Boundary Loss) 实验配置
# 主要修改:
# 1. 启用 bd_loss 以返回距离图
# 2. 添加边界损失到损失函数

exp:
  name: SAMamba_BoundaryLoss
  save_exp: True
  bs: 1
  total_epochs: 120
  log_interval: 1
  save_interval: 60
  test_interval: 1
  device: 0                    # 单卡运行 (可改为多卡如 0,1,2,3)
  nw: 4                    # 数据加载线程数

  # 加速训练配置 (最快稳定模式: AMP + 梯度累积)
  use_amp: True              # 混合精度训练，减少显存并提速 30-50%
  accum_steps: 4            # 梯度累积，bs=1时相当于bs=4
  use_compile: False         # 关闭 compile，兼容 AMP + 梯度累积
  pin_memory: True           # 锁页内存，加速CPU-GPU传输
  prefetch_factor: 4         # 数据预取数量
  channels_last: True        # channels_last 内存格式，提速约10-20%

model:
  net:
    type: SAMamba

  optim:
    type: AdamW
    init_lr: !!float 5e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]
  loss:
    loss_1:
      type: SoftIoULoss
      weight: 1
    loss_2:
      type: WeightedDiceLoss
      weight: 1
    loss_3:
      type: FocalLoss
      weight: 1
    # 添加边界损失 - 针对小目标边缘优化
    loss_4:
      type: BD_loss
      weight: 0.5  # 边界损失权重，可调整
  lr:
    warmup_iter: -1
    scheduler:
      type: CosineAnnealingLR
      step_interval: iter
      eta_min: !!float 1e-5

dataset:
  name:
  train:
    type: Dataset_aug_bac
    # data_root: c:/Users/ThinkPad/my_own_files/for_min/my_own_files/study/ai/dataset/NUDT-SIRST/trainval
    data_root: /mnt/c/users/ThinkPad/my_own_files/for_min/my_own_files/study/ai/dataset/NUDT-SIRST/trainval

    img_sz: 1024
    bd_loss: True  # 启用边界损失，需要返回距离图

  test:
    type: Dataset_test
    # data_root: c:/Users/ThinkPad/my_own_files/for_min/my_own_files/study/ai/dataset/NUDT-SIRST/test
    data_root: /mnt/c/users/ThinkPad/my_own_files/for_min/my_own_files/study/ai/dataset/NUDT-SIRST/test

    img_sz: 1024
    bd_loss: True

resume:
  # 不加载预训练模型，从头训练
  net_path:
  state_path:
